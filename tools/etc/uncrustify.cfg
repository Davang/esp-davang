# Uncrustify-0.80.1, davang c/c++ formating config

# General options
newlines                   = lf    # the type of line endings.
input_tab_size             = 4     # the original size of tabs in the input.
string_escape_char         = 92    # the ASCII value of the string escape char
disable_processing_nl_cont = false # disable formatting of NL_CONT ('\\n') ended lines (e.g. multi-line macros). 
utf8_byte                  = true  # if the file contains bytes with values between 128 and 255, but is not

# Spacing options
sp_arith  = force  # space around non-assignment symbolic operators ('+', '/', '%', '<<', and so forth).
sp_assign = force  # space around assignment operator '=', '+=', etc.

sp_cpp_lambda_square_paren        = remove # space after the capture specification of a C++11 lambda
sp_cpp_lambda_square_brace        = remove # space after the capture specification of a C++11 lambda with no argument list
sp_cpp_lambda_argument_list_empty = force  # space after the opening parenthesis and before the closing parenthesis of a argument list of a C++11 lambda 
sp_cpp_lambda_argument_list       = force  # space after the opening parenthesis and before the closing parenthesis of a argument list of a C++11 lambda
sp_cpp_lambda_paren_brace         = remove # space after the argument list of a C++11 lambda 
sp_cpp_lambda_fparen              = force  # space between a lambda body and its call operator of an immediately invoked 

sp_enum_brace  = force  # space in 'enum {'.
sp_enum_paren  = remove # space in 'NS_ENUM ('.
sp_enum_assign = force  # space around assignment '=' in enum.
sp_enum_colon  = force  # space around assignment ':' in enum.

sp_pp_concat           = remove # space around preprocessor '##' concatenation operator.
sp_pp_stringify        = remove # space after preprocessor '#' stringify operator.
sp_before_pp_stringify = remove # space before preprocessor '#' stringify operator

sp_bool                    = force  # space around boolean operators '&&' and '||'.
sp_compare                 = force  # space around compare operator '<', '>', '==', etc.
sp_inside_paren            = force  # space inside '(' and ')'.
sp_paren_paren             = force  # space between nested parentheses, i.e. '((' vs. ') )'.
sp_cparen_oparen           = force  # space between back-to-back parentheses, i.e. ')(' vs. ') ('.
sp_paren_brace             = force  # space between ')' and '{'.
sp_brace_brace             = force  # space between nested braces, i.e. '{{' vs. '{ {'.
sp_before_ptr_star         = force  # space before pointer star '*'.
sp_before_unnamed_ptr_star = force  # space before pointer star '*' that isn't followed by a variable name.
sp_between_ptr_star        = remove # space between pointer stars '*', as in 'int ***a;'.
sp_between_ptr_ref         = remove # space between pointer star '*' and reference '&', as in 'int *& a;'.

sp_after_ptr_star              = force  # space after pointer star '*', if followed by a word.
sp_after_ptr_block_caret       = force  # space after pointer caret '^', if followed by a word
sp_after_ptr_star_qualifier    = force  # space after pointer star '*', if followed by a qualifier
sp_after_ptr_star_func         = force  # space after a pointer star '*', if followed by a function
sp_after_ptr_star_trailing     = force  # space after a pointer star '*' in the trailing return of a function prototype or function definition.
sp_ptr_star_func_var           = force  # space between the pointer star '*' and the name of the variable in a function pointer definition.
sp_ptr_star_func_type          = force  # space between the pointer star '*' and the name of the type in a function pointer type definition.
sp_before_ptr_star_trailing    = force  # space before a pointer star '*' in the trailing return of a function prototype or function definition.
sp_qualifier_ptr_star_trailing = force  # space between a qualifier and a pointer star '*' in the trailing return of a function prototype or function definition

sp_before_byref      = force  # space before a reference sign '&'.
sp_after_byref       = force  # space after reference sign '&', if followed by a word.
sp_after_byref_func  = force  # space after a reference sign '&', if followed by a function prototype or function definition.
sp_before_byref_func = force  # space before a reference sign '&', if followed by a function prototype or function definition.
sp_byref_paren       = force  # space after a reference sign '&', if followed by an open parenthesis, as in 'char& (*)()'.
sp_after_type        = force  # space between type and word.
sp_after_decltype    = force  # space between 'decltype(...)' and word, brace or function call.

sp_before_template_paren = force  # space before the parenthesis in the D constructs 'template Foo(' and 'class Foo('.
sp_before_angle          = remove # space before '<'.
sp_inside_angle          = force  # space inside '<' and '>'.
sp_inside_angle_empty    = remove # space inside '<>'. 
sp_angle_colon           = remove # space between '>' and ':'.
sp_after_angle           = remove # space after '>'.
sp_angle_paren           = remove # space between '>' and '(' as found in 'new List<byte>(foo);'.
sp_angle_paren_empty     = ignore # space between '>' and '()' as found in 'new List<byte>();'.
sp_angle_word            = force  # space between '>' and a word as in 'List<byte> m;' or 'template <typename T> static ...'.
sp_angle_shift           = force  # space between '>' and '>' in '>>' (template stuff).

sp_before_sparen  = force  # force pace before '(' of control statements ('if', 'for', 'switch', 'while', etc.).
sp_inside_sparen  = force  #  space inside '(' and ')' of control statements other than 'for'.
sp_inside_for     = force  # space inside '(' and ')' of 'for' statements.
sp_sparen_paren   = force  # space between '((' or '))' of control statements.

sp_special_semi           = force  # space before empty statement ';' on 'if', 'for' and 'while'.
sp_before_semi            = remove # space before ';'.
sp_before_semi_for        = remove # space before ';' in non-empty 'for' statements.
sp_before_semi_for_empty  = force  # space before a semicolon of an empty left part of a for 'for ( <here> ; ; )'.
sp_between_semi_for_empty = force  # space between the semicolons of an empty middle part of a for as in 'for ( ; <here> ; )'.
sp_after_semi_for_empty   = force  # space after the final semicolon of an empty part of a for 'for ( ; ; <here> )'.
sp_after_semi             = force  # space after ';', except when followed by a comment.
sp_after_semi_for         = force  # space after ';' in non-empty 'for' statements.
sp_before_case_colon      = remove # space before case ':'.

sp_before_square           = remove # space before '[' (except '[]').
sp_before_vardef_square    = remove # space before '[' for a variable definition.
sp_before_square_asm_block = remove # space before '[' for asm block
sp_before_squares          = remove # space before '[]'.

sp_cpp_before_struct_binding_after_byref = remove # space before C++17 structured bindings after byref.
sp_cpp_before_struct_binding             = remove # space before C++17 structured bindings.

sp_inside_square       = force  # space inside a non-empty '[' and ']'.
sp_inside_square_empty = remove # space inside '[]'.

sp_after_comma  = force  # space after ',', i.e. 'a,b' vs. 'a, b'.
sp_before_comma = remove # space before ',', i.e. 'a,b' vs. 'a ,b'.
sp_paren_comma  = force  # space between an open parenthesis and comma,'(,' vs. '( ,'.

sp_type_colon = force  # space between a type and ':'.

sp_after_ellipsis          = force  # space after the variadic '...' when preceded by a  non-punctuator.
sp_before_ellipsis         = force  # space before the variadic '...' when preceded by a non-punctuator.
sp_type_ellipsis           = force  # space between a type and '...'.
sp_ptr_type_ellipsis       = force  # space between a '*' and '...'.
sp_paren_ellipsis          = force  # space between ')' and '...'.
sp_byref_ellipsis          = force  # space between '&&' and '...'.
sp_paren_qualifier         = force  # space between ')' and a qualifier such as 'const'.
sp_sizeof_ellipsis         = remove # space between 'sizeof' and '...'.
sp_sizeof_ellipsis_paren   = remove # space between 'sizeof...' and '('.
sp_ellipsis_parameter_pack = remove # space between '...' and a parameter pack.
sp_parameter_pack_ellipsis = remove # space between a parameter pack and '...'.
sp_decltype_paren          = remove # space between 'decltype' and '('.

sp_after_class_colon   = force # space after class ':'.
sp_before_class_colon  = force # space before class ':'.
sp_after_constr_colon  = force # space after class constructor ':'.
sp_before_constr_colon = force # space before class constructor ':'.

sp_after_operator     = remove # space between 'operator' and operator sign.
sp_after_operator_sym = remove # space between the operator symbol and the open parenthesis

sp_after_cast        = remove # space after C cast
sp_inside_paren_cast = force  # spaces inside cast parentheses.
sp_cpp_cast_paren    = remove # space between the type and open parenthesis in a C++ cast

sp_paren_noexcept = force  # space between ')' and 'noexcept'.
sp_sizeof_paren   = remove # space between 'sizeof' and '('.
sp_after_noexcept = remove # space after 'noexcept'.

sp_inside_braces       = force  # space inside '{' and '}'.
sp_inside_braces_empty = remove # space inside '{}'

sp_trailing_return     = force  # space around trailing return operator '->'.
sp_type_func           = force  # space between return type and function name.
sp_type_brace_init_lst = remove # space between type and open brace of an unnamed temporary direct-list-initialization.

sp_func_proto_paren             = remove # space between function name and '(' on function declaration.
sp_func_proto_paren_empty       = remove # space between function name and '()' on function declaration
sp_func_type_paren              = remove # space between function name and '(' with a typedef specifier.
sp_func_def_paren               = remove # space between alias name and '(' of a non-pointer function type typedef.
sp_func_def_paren_empty         = remove # space between function name and '()' on function definition
sp_inside_fparen                = force  # space inside function '(' and ')'.
sp_func_call_user_inside_rparen = force  # space inside user functor '(' and ')'.
sp_inside_rparen                = force  # space inside functor '(' and ')'.
sp_inside_tparen                = force  # space inside the first parens in the function type: 'void (*x)(...)'.
sp_after_tparen_close           = force  # space etween the parens in the function type: 'void (*x)(...)'.
sp_square_fparen                = remove # space between ']' and '(' when part of a function call.
sp_func_call_paren              = remove # space between function name and '(' on function calls.
sp_func_call_user_inside_fparen = ignore # space inside user function '(' and ')'.
sp_func_call_user_paren_paren   = force  # space between nested parentheses with user functions,
sp_func_class_paren             = remove # space between a constructor/destructor and the open parenthesis.
sp_func_class_paren_empty       = remove # space between a constructor without parameters or destructor and '()'.

sp_return       = force  # space after 'return'.
sp_return_paren = remove # space between 'return' and '('.
sp_return_brace = remove # space between 'return' and '{'.

sp_attribute_paren = remove # space between '__attribute__' and '('.
sp_defined_paren   = remove # space between 'defined' and '(' in '#if defined (FOO)'.
sp_throw_paren     = remove # space between 'throw' and '(' in 'throw (something)'.
sp_this_paren      = remove # space between 'this' and '(' in 'this (something)'.

sp_macro      = force # space between a macro name and its definition.
sp_macro_func = force # space between a macro function ')' and its definition.

sp_brace_typedef       = force  # space between '}' and the name of a typedef on the same line.
sp_word_brace_init_lst = remove # space between a variable and '{' for C++ uniform initialization.

sp_before_dc      = remove # space before the '::' operator.
sp_after_dc       = remove # space after the '::' operator.
sp_not            = remove # space after the '!' (not) unary operator.
sp_inv            = remove # space after the '~' (invert) unary operator.
sp_addr           = remove # space after the '&' (address-of) unary operator.
sp_member         = remove # space around the '.' or '->' operators.
sp_deref          = remove # space after the '*' (dereference) unary operator.
sp_sign           = remove # space after '+' or '-', as in 'x = -5' or 'y = +7'.
sp_incdec         = remove # space between '++' and '--' the word to which it is being applied
sp_before_nl_cont = force  # space before a backslash-newline at the end of a line.
sp_cond_colon     = force  # space around the ':' in 'b ? t : f'.
sp_cond_question  = force  # space around the '?' in 'b ? t : f'.
sp_case_label     = force  # space between 'case' and the label

sp_after_for_colon  = force # space after ':' in a Java/C++11 range-based 'for', as in 'for (Type var : <here> expr)'.
sp_before_for_colon = force # space before ':' in a Java/C++11 range-based 'for', as in 'for (Type var <here> : expr)'.

sp_cmt_cpp_start   = force # space after the opening of a C++ comment, as in '// <here> A'.
sp_cmt_cpp_doxygen = false # no space added with sp_cmt_cpp_start will be added after Doxygen sequences like '///', '///<', '//!' and '//!<'.
sp_cmt_cpp_qttr    = false # no space added with sp_cmt_cpp_start will be added after Qt translator or meta-data comments like '//:', '//=', and '//~'.
sp_endif_cmt       = force # space between #else or #endif and a trailing comment.

sp_after_new          = remove # space after 'new', 'delete' and 'delete[]'.
sp_between_new_paren  = remove # space between 'new' and '(' in 'new()'.
sp_after_newop_paren  = force  # space between ')' and type in 'new(foo) BAR'.
sp_inside_newop_paren = force  # space inside parentheses of the new operator

sp_before_tr_cmt      = force  # space before a trailing comment.
sp_num_before_tr_cmt  = 1      # spaces before a trailing comment.
sp_before_emb_cmt     = force  # space before an embedded comment.
sp_num_before_emb_cmt = 1      # spaces before an embedded comment.
sp_after_emb_cmt      = force  # space after an embedded comment.
sp_num_after_emb_cmt  = 1      # spaces after an embedded comment.

sp_emb_cmt_priority = false    # embedded comment spacing options have higher priority than other spacing options

sp_vala_after_translation = remove # space after '_'.
sp_before_bit_colon       = force  # space before a bit colon ':'.
sp_after_bit_colon        = force  # space after a bit colon ':'.
force_tab_after_define    = false  # no <TAB> is inserted after #define.
sp_string_string          = force  # space between two strings.
sp_struct_type            = force  # space 'struct' and a type.


#
# Indenting options
#
indent_columns   = 4 # columns to indent per level
indent_with_tabs = 0 # indent with spaces only

indent_namespace    = false # indent the body of a 'namespace'.
indent_extern       = false # indent the body of 'extern "C"'
indent_class        = true  # indent the body of a class
indent_align_string = true  # indent strings broken by '\' so that they line up
indent_member       = 0     # spaces to indent a continued '->' or '.'.
indent_sparen_extra = 0     # increase indnet in parenthesis of a control statements

indent_ignore_first_continue       = true # ignore indent for the first continuation line
indent_single_line_comments_before = 0    # spaces to indent single line ('//') comments on lines before code.
indent_single_line_comments_after  = 0    # spaces to indent single line ('//') comments on lines after code.

indent_switch_case              = 4     # Spaces to indent 'case' from 'switch'
indent_switch_body              = 0     # Spaces to indent the body of a 'switch' before any 'case'.
indent_ignore_case_brace        = false # ignore indent for '{' following 'case'.
indent_case_brace               = 0     # Spaces to indent '{' from 'case'.
indent_switch_break_with_case   = false # indent 'break' with 'case' from 'switch'.
indent_switch_pp                = true  # indent preprocessor statements inside of switch statements.
indent_case_shift               = 0     # Spaces to shift the 'case' line, without affecting any other lines.
indent_case_comment             = true  # align comments before 'case' with the 'case'.

indent_comment                   = true  # indent comments not found in first column.
indent_col1_comment              = false # indent comments found in first column.
indent_col1_multi_string_literal = false # indent multi string literal in first column.
indent_comment_align_thresh      = 3     # align comments on adjacent lines that are this many columns apart or less.
indent_ignore_label              = false # ignore indent for goto labels.

indent_label                    = 1     # indent goto labels
indent_access_spec              = -2    #  indent access specifiers, Subtract from brace indent
indent_ignore_arith             = false # ignore the indentation of an arithmetic operator.
indent_semicolon_for_paren      = false # indent a semicolon when inside a for parenthesis
indent_ignore_semicolon         = false # ignore the indentation of a semicolon outside of a 'for' statement.
indent_ignore_assign            = false # ignore the indentation of an assignment operator.
indent_align_assign             = false # align continued statements at the '='
indent_align_paren              = false # align continued statements at the '('
indent_min_vbrace_open          = 0     # spaces to reach this minimum indent when indenting after virtual brace open and newline
indent_token_after_brace        = true  # indent all contained lines to match the token
indent_cpp_lambda_body          = true  # indent the body of a C++11 lambda.
indent_ternary_operator         = 1     # indent the continuation of ternary operator. When the `if_false` is a continuation, indent it under the `if_true` branch
indent_inside_ternary_operator  = false # indent the statements inside ternary operator.
indent_off_after_return         = false # indent the chunks after a `return` sequence will be set at return indentation column
indent_off_after_return_new     = false # indent the chunks after a `return new` sequence will be set at return indentation column.

donot_indent_func_def_close_paren = false # Don't indent the close parenthesis of a function definition,

#
# Newline adding and removing options
#
nl_collapse_empty_body           = false # collapse empty blocks between '{' and '}'
nl_collapse_empty_body_functions = false #  for functions only

nl_assign_leave_one_liners = true # Don't split one-line braced assignments, as in 'foo_t f = { 1, 2 };'.
nl_class_leave_one_liners  = true # Don't split one-line braced statements inside a 'class xx { }' body.
nl_enum_leave_one_liners   = true # Don't split one-line enums, as in 'enum foo { BAR = 15 };'
nl_getset_leave_one_liners = true # Don't split one-line get or set functions.

nl_func_leave_one_liners        = true  # Don't split one-line function definitions, as in 'int foo() { return 0; }'.
nl_cpp_lambda_leave_one_liners  = true  # Don't split one-line C++11 lambdas, as in '[]() { return 0; }'.
nl_if_leave_one_liners          = false # Don't split one-line if/else statements, as in 'if(...) b++;'.
nl_while_leave_one_liners       = false # Don't split one-line while statements, as in 'while(...) b++;'.
nl_do_leave_one_liners          = false # Don't split one-line do statements, as in 'do { b++; } while(...);'.
nl_for_leave_one_liners         = false # Don't split one-line for statements, as in 'for(...) b++;'.

nl_start_of_file = remove # newlines at the start of the file.
nl_end_of_file   = remove # newlines at the end of the file.

nl_enum_brace                   = force  # newline between 'enum' and '{'.
nl_enum_class                   = remove # newline between 'enum' and 'class'.
nl_enum_class_identifier        = remove # newline between 'enum class' and the identifier.
nl_enum_identifier_colon        = remove # newline between 'enum class' type and ':'.
nl_enum_colon_type              = ignore # newline between 'enum class identifier :' and type.

nl_struct_brace                 = force #  newline between 'struct and '{'.
nl_union_brace                  = force #  newline between 'union' and '{'.

nl_before_opening_brace_func_class_def = force   # newline before '{' opening brace

nl_if_brace                     = force  # newline between 'if' and '{'.
nl_brace_else                   = force  # newline between '}' and 'else'.
nl_else_brace                   = force  # newline between 'else' and '{'.
nl_else_if                      = force  # newline between 'else' and 'if'.
nl_before_if_closing_paren      = remove # newline before 'if'/'else if' closing parenthesis.
nl_try_brace                    = force  # newline between 'try' and '{'.
nl_for_brace                    = force  # newline between 'for' and '{'.
nl_catch_brace                  = force  # newline before the '{' of a 'catch' statement, as in 'catch (decl) <here> {'.
nl_brace_catch                  = force  # newline between '}' and 'catch'.
nl_while_brace                  = force  # newline between 'while' and '{'.
nl_do_brace                     = force  # newline between 'do' and '{'.
nl_brace_while                  = remove # newline between '}' and 'while' of 'do' statement.
nl_switch_brace                 = force  # newline between 'switch' and '{'.

nl_multi_line_sparen_open  = force # Add a newline after '(' if an if/for/while/switch condition spans multiple lines
nl_multi_line_sparen_close = force #  Add a newline before ')' if an if/for/while/switch condition spans multiple lines

nl_multi_line_define = false # newline in a define after the macro name for multi-line defines.

nl_before_case = true # add a newline before 'case', and a blank line before a 'case' statement that follows a ';' or '}'.
nl_after_case  = true # add a newline after a 'case' statement.

nl_namespace_brace = force # newline between 'namespace' and '{'.

nl_template_class = force # newline after 'template<...>' of a template class.
nl_template_func  = force # newline after 'template<...>' of a template function.
nl_template_var   = force # newline after 'template<...>' of a template variable.
nl_template_using = force # newline between 'template<...>' and 'using' of a templated type alias.

nl_class_brace      = force  # newline between 'class' and '{'.
nl_class_init_args  = ignore # newline before or after  each',' in the base class list.
nl_constr_init_args = ignore # newline after each ',' in the constructor member initialization. 

nl_func_type_name       = remove # newline between return type and function name in a function definition.
nl_func_class_scope     = remove # newline between class specification and '::'
nl_func_scope_name      = remove # newline between function scope and name, as in 'void A :: <here> f() { }'.
nl_func_proto_type_name = remove # newline between return type and function name in a prototype.
nl_func_paren           = remove # newline between a function name and the opening '(' in the declaration.

nl_func_call_paren       = remove # newline between a function name and the opening '(' in the call.
nl_func_call_paren_empty = remove # ignore/add/remove/force
nl_func_call_args        = remove # newline after each ',' in a function call.

nl_func_decl_start = remove # newline after '(' in a function declaration.
nl_func_decl_end   = remove # newline before the ')' in a function declaration.
nl_func_decl_args  = remove # newline after each ',' in a function declaration.

nl_func_def_start = remove # newline after '(' in a function definition.
nl_func_def_end   = remove # newline before the ')' in a function definition.
nl_func_def_args  = remove # newline after each ',' in a function definition.
nl_func_def_paren = remove # newline between a function name and the opening '(' in the definition.

nl_func_decl_args_multi_line = true # add a newline after each ',' in a function declaration if '(' and ')' are in different lines. If false, nl_func_decl_args is used instead.
nl_func_def_args_multi_line  = true # add a newline after each ',' in a function definition if '(' and ')' are in different lines. If false, nl_func_def_args is used instead.


nl_func_decl_end_multi_line = true # add a newline before ')' in a function declaration if '(' and ')' are in different lines. If false, nl_func_decl_end is used instead.
nl_func_def_end_multi_line  = true # add a newline before ')' in a function definition if '(' and ')' are in different lines. If false, nl_func_def_end is used instead.

nl_func_decl_empty = remove # newline between '()' in a function declaration.
nl_func_def_empty  = remove # newline between '()' in a function definition.

nl_func_call_empty = remove # newline between '()' in a function call.
nl_func_call_start = remove # newline after '(' in a function call,
nl_func_call_end   = remove # newline before ')' in a function call.

nl_func_call_start_multi_line = true  # newline after '(' in a function call if '(' and ')' are in different lines.
nl_func_call_args_multi_line  = true  # newline after each ',' in a function call if '(' and ')' are in different lines.
nl_func_call_end_multi_line   = true  # newline before ')' in a function call if '(' and ')' are in different lines.

nl_template_start = false  # newline after '<' of a template parameter list.
nl_template_args  = false  # newline after each ',' in a template parameter list.
nl_template_end   = false  # newline before '>' of a template parameter list.

nl_fdef_brace      = force  #  newline between function signature and '{'.
nl_fdef_brace_cond = force  #  newline between function signature and '{', if signature ends with ')'. Overrides nl_fdef_brace.

nl_cpp_ldef_brace  = true   #  newline between C++11 lambda signature and '{'.
nl_return_expr     = remove #  newline between 'return' and the return expression.
nl_throw_expr      = remove #  newline between 'throw' and the throw expression.
nl_after_semicolon = false  # newline after semicolons, except in 'for' statements.

nl_type_brace_init_lst       = remove # newline after the type in an unnamed temporary direct-list-initialization, better:
nl_type_brace_init_lst_open  = remove # newline after the open brace in an unnamed temporary direct-list-initialization.
nl_type_brace_init_lst_close = remove # newline before the close brace in an unnamed temporary direct-list-initialization.

nl_define_macro        = false # alter newlines in '#define' macros.
nl_squeeze_paren_close = false # alter newlines between consecutive parenthesis closes. .

nl_squeeze_ifdef           = false # remove blanks after '#ifxx' and '#elxx', or before '#elxx' and '#endif'. Does not affect top-level #ifdefs.
nl_squeeze_ifdef_top_level = false # makes the nl_squeeze_ifdef option affect the top-level #ifdefs as well.

nl_ds_struct_enum_cmt         = false  # double-space commented-entries in 'struct'/'union'/'enum'.
nl_class_colon                = remove # newline before or after a class
nl_namespace_two_to_one_liner = false  # collapse a two-line namespace, like 'namespace foo\n{ decl; }'

nl_create_if_one_liner        = false  # remove a newline in simple unbraced if statements, turning them into one-liners, as in 'if(b)\n i++;' => 'if(b) i++;'.
nl_create_for_one_liner       = false  # remove a newline in simple unbraced for statements, turning them into one-liners, as in 'for (...)\n stmt;' => 'for (...) stmt;'.
nl_create_while_one_liner     = false  # remove a newline in simple unbraced while statements, turning them into one-liners, as in 'while (expr)\n stmt;' => 'while (expr) stmt;'.
nl_create_func_def_one_liner  = false  # collapse a function definition  that the entire definition (prototype, braces, body) is a single line.
nl_create_list_one_liner      = false  # split one-line simple list definitions into three lines by adding newlines, as in 'int a[12] = { <here> 0 <here> };'.

nl_split_if_one_liner         = false  # split one-line simple unbraced if statements into two lines by adding a newline, as in 'if(b) <here> i++;'.
nl_split_for_one_liner        = false  # split one-line simple unbraced for statements into two lines by adding a newline, as in 'for (...) <here> stmt;'.
nl_split_while_one_liner      = false  # split one-line simple unbraced while statements into two lines by adding a newline, as in 'while (expr) <here> stmt;'.

donot_add_nl_before_cpp_comment = false # Don't add a newline before a cpp-comment in a parameter list of a function call.

#
# Blank line options
#
nl_max               = 4      # consecutive newlines (3 = 2 blank lines)
nl_max_blank_in_func = nl_max # consecutive newlines in a function.

nl_inside_empty_func      = 2                    # newlines inside an empty function body.
nl_before_func_body_proto = nl_inside_empty_func # newlines before a function prototype.

nl_before_func_class_proto      = 3      # newlines before a class constructor/destructor prototype.
nl_before_func_class_def        = 3      # newlines before a class constructor/destructor definition.
nl_after_func_proto             = 3      # newlines after a function prototype.
nl_after_func_proto_group       = 3      # newlines after a function prototype, if not followed by
nl_after_func_class_proto       = 3      # newlines after a class constructor/destructor prototype.
nl_after_func_class_proto_group = 3      # newlines after a class constructor/destructor prototype, if not followed by another constructor/destructor prototype.
nl_class_leave_one_liner_groups = false  # one-line method definitions inside a class body should be treated as if they were prototypes

nl_min_after_func_body          = 4 # newlines after '}' of a multi-line function body.
nl_max_after_func_body          = 4 # newlines after '}' of a multi-line function body.
nl_after_func_body_class        = 3 #  newlines after '}' of a multi-line function body in a class declaration. Also affects class constructors/destructors.
nl_after_func_body_one_liner    = 3 #  newlines after '}' of a single line function body. Also  affects class constructors/destructors.

nl_after_multiline_comment = false # force a newline after a multi-line comment.

nl_after_label_colon = false # force a newline after a label's colon.

nl_before_struct = 3 # newlines before a struct definition.
nl_after_struct  = 3 # newlines after '}' or ';' of a struct/enum/union definition.
nl_before_class  = 3 # newlines before a class definition.
nl_after_class   = 0 # newlines after '}' or ';' of a class definition.

nl_before_namespace = 3 #  newlines before a namespace.
nl_after_namespace  = 3 # newlines after '}' of a namespace.

nl_before_access_spec      = 0 # newlines before an access specifier label. This also includes the Qt-specific 'signals:' and 'slots:'.
nl_after_access_spec       = 0 # newlines after an access specifier label. This also includes the Qt-specific 'signals:' and 'slots:'.

nl_comment_func_def        = 0 # newlines between a function definition and the function comment, as in '// comment\n <here> void foo() {...}'.
nl_after_try_catch_finally = 0 # newlines after a try-catch-finally block that isn't followed by a brace close.

eat_blanks_after_open_brace   = true # Whether to remove blank lines after '{'.
eat_blanks_before_close_brace = true # Whether to remove blank lines before '}'.

nl_remove_extra_newlines = 0 # No change to remove extra newlines not in preprocessor.

nl_before_whole_file_ifdef = 0 # newlines before a whole-file #ifdef.
nl_after_whole_file_ifdef  = 0 # newlines after a whole-file #ifdef.
nl_before_whole_file_endif = 0 # newlines before a whole-file #endif.
nl_after_whole_file_endif  = 0 # newlines after a whole-file #endif.

#
# Line splitting options
#
code_width                      = 200   # Try to limit code width to N columns.
ls_for_split_full               = false # Whether to fully split long 'for' statements at semi-colons.
ls_func_split_full              = false # Whether to fully split long function prototypes/calls at commas.
ls_code_width                   = false # Whether to split lines as close to code_width as possible and ignore some groupings

#
# Code alignment options (not left column spaces/tabs)
#
align_keep_tabs                 = false # Whether to keep non-indenting tabs.
align_with_tabs                 = false # Whether to use tabs for aligning.
align_on_tabstop                = false # Whether to bump out to the next tab when aligning.
align_number_right              = false # Whether to right-align numbers.
align_keep_extra_space          = false # Whether to keep whitespace not required for alignment.

align_func_params               = false # Whether to align variable definitions in prototypes and functions.
align_func_params_span          = 2     # The span for aligning parameter definitions in function on parameter name.
align_func_params_thresh        = 0     # The threshold for aligning function parameter definitions.
align_func_params_gap           = 2     # The gap for aligning function parameter definitions.

align_constr_value_span         = 2 # The span for aligning constructor value.
align_constr_value_thresh       = 0 # The threshold for aligning constructor value.
align_constr_value_gap          = 2 # The gap for aligning constructor value.

align_same_func_call_params        = false # Whether to align parameters in single-line functions that have the same name
align_same_func_call_params_span   = 0     # The span for aligning function-call parameters for single line functions.
align_same_func_call_params_thresh = 0     # The threshold for aligning function-call parameters for single line functions


align_var_def_span      = 2     # The span for aligning variable definitions.
align_var_def_thresh    = 0     # The threshold for aligning variable definitions.
align_var_def_gap       = 2     # The gap for aligning variable definitions.
align_var_def_colon     = false # Whether to align the colon in struct bit fields.
align_var_def_colon_gap = 2     # The gap for aligning the colon in struct bit fields.
align_var_def_attribute = false # Whether to align any attribute after the variable name.
align_var_def_inline    = false # Whether to align inline struct/enum/union variable definitions.

align_assign_span              = 2     # The span for aligning on '=' in assignments.
align_assign_func_proto_span   = 0     # The span for aligning on '=' in function prototype modifier.
align_assign_thresh            = 0     # The threshold for aligning on '=' in assignments.
align_assign_on_multi_var_defs = false # Whether to align on the left most assignment when multiple definitions are found on the same line.

align_braced_init_list_span   = 0 # The span for aligning on '{' in braced init list.
align_braced_init_list_thresh = 0 # The threshold for aligning on '{' in braced init list.

align_enum_equ_span   = 2 # The span for aligning on '=' in enums.
align_enum_equ_thresh = 0 # The threshold for aligning on '=' in enums.

align_var_class_span    = 2 # The span for aligning class member definitions.
align_var_class_thresh  = 0 # The threshold for aligning class member definitions.
align_var_class_gap     = 0 # The gap for aligning class member definitions.
align_var_struct_span   = 2 # The span for aligning struct/union member definitions.
align_var_struct_thresh = 3 # The threshold for aligning struct/union member definitions.
align_var_struct_gap    = 0 # The gap for aligning struct/union member definitions.

align_struct_init_span      = 2     # The span for aligning struct initializer values.
align_typedef_span          = 2     # The span for aligning single-line typedefs.
align_typedef_gap           = 0     # The minimum space between the type and the synonym of a typedef.
align_on_operator           = false # Whether to align function prototypes on the 'operator' keyword instead of what follows.
align_mix_var_proto         = false # Whether to mix aligning prototype and variable declarations.
align_single_line_brace_gap = 0     # Gap for align_single_line_brace.
align_pp_define_together    = false # Whether to align macro functions and variables together.

#
# Code modifying options (non-whitespace)
#
mod_full_brace_do  = force  # braces on a single-line 'do' statement.
mod_full_brace_for = force  # braces on a single-line 'for' statement.
mod_full_brace_if  = force  # braces on a single-line 'if' statement. Braces will not be removed if the braced statement forcens an 'else'.

mod_full_brace_if_chain_only = true   # add braces to all blocks of an 'if'/'else if'/'else' chain.
mod_full_brace_while         = force  # braces on single-line 'while' statement.
mod_full_brace_using         = force  # braces on single-line 'using ()' statement.
mod_paren_on_return          = remove # unnecessary parentheses on 'return' statement.
mod_paren_on_throw           = remove # Add or remove unnecessary parentheses on 'throw' statement.
mod_full_paren_if_bool       = true   # fully parenthesize Boolean expressions in 'while' and 'if' statement, as in 'if (a && b > c)' => 'if (a && (b > c))'.
mod_full_paren_assign_bool   = true   # fully parenthesize Boolean expressions after '=' statement, as in 'x = a && b > c;' => 'x = (a && (b > c));'.
mod_full_paren_return_bool   = true   # fully parenthesize Boolean expressions after '=' statement, as in 'return  a && b > c;' => 'return (a && (b > c));'.
mod_remove_extra_semicolon   = true   # remove superfluous semicolons.
mod_remove_duplicate_include = true   # remove duplicate include.
mod_sort_case_sensitive      = true   # take care of the case by the mod_sort_xx options.

mod_sort_incl_import_prioritize_filename          = true  # prioritize '#include' and '#import' statements that contain filename without extension when sorting is enabled.
mod_sort_incl_import_prioritize_extensionless     = true  # prioritize '#include' and '#import' statements that does not contain extensions when sorting is enabled.
mod_sort_incl_import_prioritize_angle_over_quotes = true  # prioritize '#include' and '#import' statements that contain angle over quotes when sorting is enabled.
mod_sort_incl_import_ignore_extension             = false # ignore file extension in '#include' and '#import' statements for sorting comparison.
mod_sort_incl_import_grouping_enabled             = true  # group '#include' and '#import' statements when sorting is enabled.

mod_move_case_break  = true   # Whether to move a 'break' that appears after a fully braced 'case' before
mod_move_case_return = true   # Whether to move a 'return' that appears after a fully braced 'case' before
mod_enum_last_comma  = remove # Add or remove the comma after the last value of an enumeration.

#
# Preprocessor options
#
pp_space_after      = remove # space after # based on pp level of #if blocks.
pp_if_indent_code   = false  # Whether to indent the code between #if, #else and #endif.
pp_indent_in_guard  = false  # Whether to indent the body of an #if that encompasses all the code in the file.

pp_multiline_define_body_indent = -4 # offset that controls the indentation of the body of a multiline #define. Relative to the column of the '#' of '#define'
pp_unbalanced_if_action         = 1  # unbalanced #if and #else blocks are found, print a warning message

#
# Use or Do not Use options
#
use_sp_after_angle_always                     = false # Whether sp_after_angle takes precedence over sp_inside_fparen.
use_options_overriding_for_qt_macros          = true  # Whether to apply special formatting for Qt SIGNAL/SLOT macros.
use_form_feed_no_more_as_whitespace_character = true  # the form feed character is removed from the list of whitespace
debug_timeout                                 = 2     # second(s) before terminating formatting the current file,